<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#ec4899;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#38bdf8;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#38bdf8;#6366f1;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="846" height="236" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="2" y="2" width="846" height="236" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Corner Glows -->
  <circle cx="90" cy="50" r="140" fill="#38bdf8" opacity="0.09" />
  <circle cx="750" cy="180" r="140" fill="#a855f7" opacity="0.09" />

  <!-- Top Accent Neon Bar with Animation -->
  <rect x="2" y="2" width="846" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Top Tag / Badge -->
  <g transform="translate(45, 42)">
    <rect x="0" y="0" width="285" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="14" cy="13" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" fill="#38bdf8" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.5">INGENIERÍA EN MULTIMEDIA • UMNG</text>
  </g>

  <!-- Location Badge -->
  <g transform="translate(670, 42)">
    <text x="0" y="17" fill="#94a3b8" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="11">📍 Bogotá, Colombia 🇨🇴</text>
  </g>

  <!-- Main Name Title -->
  <text x="45" y="112" fill="url(#textShimmer)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5">
    JOSE LUIS PINEDA BARRERA
  </text>

  <!-- Subtitle Divider Line -->
  <line x1="45" y1="130" x2="805" y2="130" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Animated Cycling Roles (Pure SMIL) -->
  <g transform="translate(45, 165)">
    <!-- Slide 1: Game Dev -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;1" keyTimes="0;0.22;0.25;0.97;0.98;0.99;0.999;1" dur="14s" repeatCount="indefinite" />
      <text x="0" y="0" fill="#f43f5e" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="13" font-weight="bold">🎮 VIDEO GAME DEVELOPMENT</text>
      <text x="0" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Unreal Engine • Unity • C++ &amp; C# • Autodesk Maya 3D • Mecánicas &amp; Shaders</text>
    </g>

    <!-- Slide 2: AI & Deep Learning -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.24;0.26;0.48;0.51;0.98;0.99;1" dur="14s" repeatCount="indefinite" />
      <text x="0" y="0" fill="#a855f7" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="13" font-weight="bold">🧠 DEEP LEARNING &amp; MULTIMEDIA AI</text>
      <text x="0" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Reconocimiento acústico (CNN/RNN) • Procesamiento de Audio • NLP con TensorFlow</text>
    </g>

    <!-- Slide 3: Computer Graphics -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.73;0.76;0.98;0.99;1" dur="14s" repeatCount="indefinite" />
      <text x="0" y="0" fill="#38bdf8" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="13" font-weight="bold">📐 COMPUTACIÓN GRÁFICA &amp; 3D WEB</text>
      <text x="0" y="24" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Three.js • WebGL • Transformaciones Matriciales • Proyecciones y Poliedros</text>
    </g>

    <!-- Slide 4: Active Project -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.74;0.75;0.76;0.77;0.97;0.99;1" dur="14s" repeatCount="indefinite" />
      <text x="0" y="0" fill="#10b981" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="13" font-weight="bold">🚀 EN DESARROLLO ACTIVO: SNAKE GAME</text>
      <text x="0" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Desarrollando videojuego Snake con nuevas mecánicas interactivas • ¡Más proyectos en camino!</text>
    </g>
  </g>
</svg>
