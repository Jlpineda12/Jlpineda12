<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <!-- Minimalist Accent Gradient -->
    <linearGradient id="neonSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Clean Dot Matrix -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Clean Minimalist Background blending with GitHub Dark -->
  <rect width="850" height="160" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <rect width="850" height="160" rx="12" fill="url(#dotGrid)" />

  <!-- Left Neon Accent Pill Indicator -->
  <rect x="35" y="42" width="4" height="76" rx="2" fill="url(#neonSky)" />

  <!-- Main Name Title (Minimalist, Clean Typography) -->
  <text x="55" y="74" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="-0.5">
    Jose Luis Pineda Barrera
  </text>

  <!-- Animated Clean Subtitle (Pure SVG SMIL) -->
  <g transform="translate(55, 104)">
    <!-- Slide 1: Ingenieria en Multimedia Colombia -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;1" keyTimes="0;0.22;0.25;0.97;0.98;0.99;0.999;1" dur="15s" repeatCount="indefinite" />
      <text x="0" y="0" fill="#38bdf8" font-family="'SF Mono', Monaco, Menlo, Consolas, monospace" font-size="13.5" font-weight="500">
        🎓 Ingeniería en Multimedia • Colombia 🇨🇴
      </text>
    </g>

    <!-- Slide 2: LingoPulse & Game Dev -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.24;0.26;0.48;0.51;0.98;0.99;1" dur="15s" repeatCount="indefinite" />
      <text x="0" y="0" fill="#38bdf8" font-family="'SF Mono', Monaco, Menlo, Consolas, monospace" font-size="13.5" font-weight="500">
        🎮 Video Game Dev &amp; 3D • LingoPulse (Tamagotchi 3D) • Unreal &amp; Unity
      </text>
    </g>

    <!-- Slide 3: Computer Graphics & AI -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.73;0.76;0.98;0.99;1" dur="15s" repeatCount="indefinite" />
      <text x="0" y="0" fill="#38bdf8" font-family="'SF Mono', Monaco, Menlo, Consolas, monospace" font-size="13.5" font-weight="500">
        📐 Computación Gráfica 3D (Three.js) &amp; Deep Learning Aplicado (Melodía AI)
      </text>
    </g>

    <!-- Slide 4: Active Snake Project -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.74;0.75;0.76;0.77;0.97;0.99;1" dur="15s" repeatCount="indefinite" />
      <text x="0" y="0" fill="#34d399" font-family="'SF Mono', Monaco, Menlo, Consolas, monospace" font-size="13.5" font-weight="500">
        🚀 Proyecto en desarrollo: Videojuego Snake 3D interactivo
      </text>
    </g>
  </g>

  <!-- Right Decorative Minimalist Vector Controller Line Art -->
  <g transform="translate(730, 48) scale(1.6)" stroke="#38bdf8" stroke-opacity="0.35" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4a2 2 0 0 1-3.6 1.2L12.5 9h-3L7.6 11.2A2 2 0 0 1 4 10V6z"/>
    <path d="M5.5 6v2m-1-1h2m9 0h.01m-1.5-1h.01m0 2h.01m-1.5-1h.01"/>
    <circle cx="8" cy="11.5" r="1.2" stroke="#38bdf8" stroke-opacity="0.25"/>
    <circle cx="14" cy="11.5" r="1.2" stroke="#38bdf8" stroke-opacity="0.25"/>
  </g>
</svg>
