<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="310">
  <defs>
    <!-- Sky Blue HUD Theme Gradients -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031d36" />
      <stop offset="50%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#021c33" />
    </linearGradient>

    <linearGradient id="hudBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <linearGradient id="panelGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- HUD Main Outer Beveled Card -->
  <polygon points="20,2 830,2 848,20 848,290 830,308 20,308 2,290 2,20" fill="url(#hudBg)" stroke="url(#hudBorder)" stroke-width="1.8" />
  <polygon points="20,2 830,2 848,20 848,290 830,308 20,308 2,290 2,20" fill="url(#scanlines)" />

  <!-- Top Gamer Header Bar -->
  <rect x="25" y="16" width="800" height="38" rx="8" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
  
  <!-- Status Lights & Player Info -->
  <circle cx="45" cy="35" r="5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="60" y="40" fill="#bae6fd" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="12" font-weight="bold">PLAYER: JLPINEDA12</text>
  
  <text x="250" y="40" fill="#ffffff" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="12" font-weight="bold">CLASS: INGENIERO EN MULTIMEDIA</text>
  
  <!-- Health & Mana Bars -->
  <g transform="translate(560, 26)">
    <text x="0" y="10" fill="#f43f5e" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="10" font-weight="bold">HP</text>
    <rect x="22" y="2" width="70" height="10" rx="3" fill="#0f172a" stroke="#f43f5e" stroke-width="0.8" />
    <rect x="24" y="4" width="66" height="6" rx="2" fill="#f43f5e">
      <animate attributeName="width" values="66;60;66" dur="4s" repeatCount="indefinite" />
    </rect>

    <text x="110" y="10" fill="#38bdf8" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="10" font-weight="bold">MP</text>
    <rect x="132" y="2" width="70" height="10" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
    <rect x="134" y="4" width="66" height="6" rx="2" fill="#38bdf8" />

    <text x="225" y="11" fill="#fbbf24" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="11" font-weight="bold">LVL: 99</text>
  </g>

  <!-- Left Column: Skill Tree & Character Stats -->
  <g transform="translate(25, 68)">
    <rect x="0" y="0" width="385" height="225" rx="10" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
    <text x="20" y="28" fill="#38bdf8" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="12" font-weight="bold" letter-spacing="1">⚔️ STATS &amp; SKILL TREE</text>
    <line x1="20" y1="36" x2="365" y2="36" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- Stat 1: Game Dev -->
    <g transform="translate(20, 56)">
      <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">🎮 Game Dev &amp; 3D (Unreal • Unity • C++)</text>
      <text x="310" y="0" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="11" font-weight="bold">95%</text>
      <rect x="0" y="8" width="345" height="7" rx="3.5" fill="#0c2338" />
      <rect x="0" y="8" width="327" height="7" rx="3.5" fill="url(#barGrad1)">
        <animate attributeName="width" values="320;327;320" dur="3s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Stat 2: Computer Graphics -->
    <g transform="translate(20, 98)">
      <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">📐 Computación Gráfica (Three.js • WebGL)</text>
      <text x="310" y="0" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="11" font-weight="bold">90%</text>
      <rect x="0" y="8" width="345" height="7" rx="3.5" fill="#0c2338" />
      <rect x="0" y="8" width="310" height="7" rx="3.5" fill="url(#barGrad2)" />
    </g>

    <!-- Stat 3: Multimedia AI -->
    <g transform="translate(20, 140)">
      <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">🧠 IA Multimedia &amp; Audio (CNN • RNN • Librosa)</text>
      <text x="310" y="0" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="11" font-weight="bold">88%</text>
      <rect x="0" y="8" width="345" height="7" rx="3.5" fill="#0c2338" />
      <rect x="0" y="8" width="303" height="7" rx="3.5" fill="url(#barGrad1)" />
    </g>

    <!-- Stat 4: Systems & APIs -->
    <g transform="translate(20, 182)">
      <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">🌐 Game APIs &amp; Backend (Node • Prisma • Flask)</text>
      <text x="310" y="0" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="11" font-weight="bold">92%</text>
      <rect x="0" y="8" width="345" height="7" rx="3.5" fill="#0c2338" />
      <rect x="0" y="8" width="317" height="7" rx="3.5" fill="url(#barGrad2)" />
    </g>
  </g>

  <!-- Right Column: Active Quests & Missions -->
  <g transform="translate(435, 68)">
    <rect x="0" y="0" width="390" height="225" rx="10" fill="url(#panelGlass)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
    <text x="20" y="28" fill="#38bdf8" font-family="'SF Mono', Monaco, Menlo, monospace" font-size="12" font-weight="bold" letter-spacing="1">📜 QUEST LOG &amp; MISIONES ACTIVAS</text>
    <line x1="20" y1="36" x2="370" y2="36" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- Quest 1: Active Snake Game -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="350" height="38" rx="6" fill="#0c2338" stroke="#10b981" stroke-width="1" />
      <circle cx="16" cy="19" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">🎯 MISIÓN ACTIVA: Videojuego Snake 3D</text>
      <text x="28" y="31" fill="#7dd3fc" font-family="'SF Mono', monospace" font-size="9.5">Mecánicas interactivas y shaders • [EN DESARROLLO]</text>
    </g>

    <!-- Quest 2: Melodia AI -->
    <g transform="translate(20, 94)">
      <rect x="0" y="0" width="350" height="38" rx="6" fill="#0c2338" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.5" />
      <text x="12" y="18" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">🏆 COMPLETADA: Melodía AI (Audio CNN/RNN)</text>
      <text x="12" y="31" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="9.5">Reconocimiento acústico con Web Audio • [PUBLICADO]</text>
    </g>

    <!-- Quest 3: GameVault API -->
    <g transform="translate(20, 138)">
      <rect x="0" y="0" width="350" height="38" rx="6" fill="#0c2338" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.5" />
      <text x="12" y="18" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">🛡️ COMPLETADA: GameVault API (Node &amp; Prisma)</text>
      <text x="12" y="31" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="9.5">Backend para catálogo y tracking de juegos • [PUBLICADO]</text>
    </g>

    <!-- Quest 4: 12 Labs Graphics -->
    <g transform="translate(20, 182)">
      <rect x="0" y="0" width="350" height="34" rx="6" fill="#0c2338" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.5" />
      <text x="12" y="16" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">📐 COMPLETADA: 12 Talleres Three.js &amp; WebGL</text>
      <text x="12" y="28" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="9.5">Matemática matricial y proyecciones 3D • [PUBLICADO]</text>
    </g>
  </g>
</svg>
